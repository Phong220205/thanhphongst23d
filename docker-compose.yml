# Xóa dòng version ở đây nếu muốn
# version: '3.8'

services:
  # 1. Database Service (MySQL)
  db:
    image: mysql:8.0
    container_name: cd_store_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASS} # Chỉ giữ lại 2 dòng này
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - cd-store-network
    # Healthcheck để Backend chờ
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-uroot", "-p${DB_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Backend Service (Node.js + Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cd_store_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file: ./.env
    environment:
      - DB_HOST=db # Trỏ đến service 'db'
      - DB_NAME=${DB_NAME:-cd_store}
      - DB_USER=${DB_USER:-root}
      - DB_PASS=${DB_PASS}
      - DB_PORT=3306
      - NODE_ENV=development
    # Đợi DB "khỏe" mới chạy
    depends_on:
      db:
        condition: service_healthy
    # Healthcheck để Frontend chờ
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cd-store-network

  # 3. Frontend Service (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cd_store_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # --- VÔ HIỆU HÓA DÒNG NÀY ĐỂ SỬA LỖI SYNC CODE CŨ ---
      # - ./frontend:/app 
      - /app/node_modules
      - /app/.next
    env_file: ./.env # Thêm env_file cho frontend
    environment:
      - NODE_ENV=development
      # Biến này để Server Component gọi API (dùng http://host.docker.internal)
      - NEXT_PUBLIC_BACKEND_URL_SERVER=http://host.docker.internal:5000
    # Đợi Backend "khỏe" mới chạy
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cd-store-network

  # 4. phpMyAdmin Service
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: cd_store_pma
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db # Trỏ đến service 'db'
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    depends_on:
      - db
    networks:
      - cd-store-network

networks:
  cd-store-network:
    driver: bridge

volumes:
  db-data:
    driver: local